# /hep-graph

Raw arguments:
{{args}}

Use the independent Agentlas CLI for `new <request>`, `list`, `show <name>`, or
`run <name>`. Never route this through Gemini CLI, Hephaestus Workforce, or Hub
search.

Resolve the first executable from `command -v agentlas`,
`$HOME/.agentlas/runtime/current/bin/agentlas`, and `./bin/agentlas`. If none
exists, report `Agentlas CLI not found. Install it with: npm i -g agentlas` and
