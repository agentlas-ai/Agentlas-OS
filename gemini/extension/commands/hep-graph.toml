For `new`, relay the CLI interview questions and never invent schedule,
external-effect, repetition, or verification-checklist answers. The final save
confirmation is approval and the new graph starts switched off.

For `show`, preserve tree wiring, external-effect and ask-first marks, branch
sides, repeat edges, verification checklists, code steps, and required input.

For `run`, the user's direct command is sufficient authority. Do not ask for a
second approval. Show the graph first, obtain only genuinely missing input, and
then call `agentlas graph run <name> -y`, with `--input <value>` when required.
Report that the run was requested from Agentlas Desktop, never that it executed.
Relay any non-zero refusal exactly and do not retry with a guess.
