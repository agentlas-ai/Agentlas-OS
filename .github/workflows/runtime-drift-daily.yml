name: Runtime drift (daily)

# Daily drift is an early-warning feed, not a release mechanism. A newer
# version is expected and is adopted by the release workflow immediately before
# its compatibility gates. Only an unavailable/missing runtime or a failed
# initialize probe makes this workflow red; version and capability changes stay
# visible in the summary and artifact without being mislabeled as an outage.

on:
  schedule:
    - cron: "45 5 * * *"   # after the registry's own 05:15 UTC probe run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Fetch yesterday's matrix snapshot (best effort)
        run: |
          d="$(date -u -d 'yesterday' +%Y-%m-%d)"
          curl -fsSL -A "agentlas-runtime-drift/1.0" \
            "https://raw.githubusercontent.com/agentclientprotocol/registry/main/.protocol-matrix/snapshots/${d}.json" \
            -o previous-matrix.json || echo "no snapshot for ${d}"
      - name: Compare pins, health, and capabilities
        run: |
          set -euo pipefail
          prev=()
          [[ -s previous-matrix.json ]] && prev=(--previous-matrix previous-matrix.json)
          python3 scripts/check-runtime-drift.py --json "${prev[@]}" > runtime-drift.json || rc=$?
          rc="${rc:-0}"
          if [[ "$rc" == "2" ]]; then
            cat runtime-drift.json
            echo "runtime drift inputs were unavailable" >&2
            exit 2
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("runtime-drift.json").read_text(encoding="utf-8"))
          findings = report.get("findings") or []
          blocking = [item for item in findings if item.get("kind") in {"health", "missing"}]
          pending = [item for item in findings if item.get("kind") == "version"]
          review = [item for item in findings if item.get("kind") not in {"health", "missing", "version"}]

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Runtime drift\n\n")
              out.write(f"- Actual runtime failures: **{len(blocking)}**\n")
              out.write(f"- Updates pending for the next release: **{len(pending)}**\n")
              out.write(f"- Compatibility changes to review: **{len(review)}**\n\n")
              for label, rows in (("Actual failures", blocking), ("Release updates", pending), ("Review", review)):
                  if not rows:
                      continue
                  out.write(f"### {label}\n\n")
                  for item in rows:
                      out.write(f"- `{item.get('runtime')}` / `{item.get('kind')}`: {item.get('detail')}\n")
                  out.write("\n")
          if blocking:
              raise SystemExit("actual runtime health failure detected")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-drift-${{ github.run_id }}
          path: |
            runtime-drift.json
            previous-matrix.json
          if-no-files-found: ignore
