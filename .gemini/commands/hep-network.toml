description = "Staff a task from registered Local, owner Cloud, and public Hub agents."
prompt = """
Update fallback: 자동 업데이트가 안 되면 `hephaestus update`를 한 번 실행하세요. 업데이트하지 않아도 현재 버전 명령은 그대로 동작합니다.
# /hep-network

Request: {{args}}

Act as the active top-level workforce orchestrator. Use the local Agentlas
OS MCP server `hephaestus-network`, the only host-visible Workforce MCP. Core
reaches Cloud and Hub through its internal upstream client. Network means registered Local + signed-in owner
Cloud + public Hub.

The user does not need to say `goal`. First read
`workforce.goal_context(projectDir)` and reuse an active binding for the same
ongoing work before considering recruitment.

1. Author a redacted `agentlas.workforce-work-order.v1`; private grounding
   stays on-host. Fill a slot with task/cardinality/criticality plus only the communities/skills/knowledge, runtimes, and languages that genuinely constrain the hire; omit every other list field (absent = empty — the wire normalizes) and never fill requiredToolCapabilities, requiredAuthorities, forbiddenAuthorities, consumes, produces, requiredRoles, or modalities: tools, authorities, and modalities attach to the executing runtime, not the agent card, so those gates only exclude real candidates — put ordinary inputs/outputs in the task text and handoffs in edges. Write its discovery-facing fields in English, faithfully
   translating a non-English request (the candidate corpus is English;
   cross-lingual matching buries the right agent, measured 1st vs 144th for one
   query), while keeping `languages` as the required delivery language.
2. Call `workforce.search_candidates` with
   `{workOrder, sourceScope: "network"}` and keep the response as
   `federationResult`, preserving every source receipt and provenance row.
3. Author `agentlas.workforce-selection.v1` yourself from content and
   qualification evidence, then call `workforce.validate_selection` with
   `{workOrder, selection}` and keep the response as `federatedSelection`. Revise on rejection;
   deterministic code may govern but may not choose, rerank, or substitute.
4. Call `workforce.prepare_execution` with
   `{workOrder, selection, federatedSelection, projectDir, goalId?}` and require
   exact source/release/package/content/runtime/permission/context pins.
   `projectDir` is mandatory; pass an incumbent `goalId` when continuing.
   Otherwise Core derives one from the WorkOrder id and automatically binds the
   successful plan before execution.
5. On every later turn read `workforce.goal_context`, reuse the incumbent
   roster plus local skills when sufficient, recruit only a real additive gap
   using the same `goalId`, and record the posture with
   `workforce.record_goal_turn`.
6. Run only useful bound planner/manager, worker, synthesis, and verifier
   invocations with explicit handoffs and preserve Team graphs.

The roster survives turns, sessions, restarts, compaction, and 24-hour lease
expiry. Release it only through
`workforce.complete_goal(explicitCompletion=true)` when the whole goal is
explicitly completed/cancelled. Lease expiry controls only the next Hub charge;
standby is durable availability, not a continuously running model.

Report execution only from a receipt proving every child invocation and a
passing verifier. Otherwise report the last truthful state, including every
unavailable source. Do not call legacy `hephaestus_route`, bypass Core with
direct remote search, or use popularity/history/price/availability as fit.
"""
