description = "Build, repair, or package Agentlas agents and teams with Hephaestus."
prompt = """
Update fallback: 자동 업데이트가 안 되면 `hephaestus update`를 한 번 실행하세요. 업데이트하지 않아도 현재 버전 명령은 그대로 동작합니다.

# /hep-build


Raw arguments:
{{args}}

Use Hephaestus as the Agentlas builder surface. This is the clearer
public build surface next to hep-network and hep-cloud.

Resolve the installed engine before reading contracts or running commands:

```bash
ENGINE=""
for candidate in \
  "${GEMINI_EXTENSION_ROOT:-}" \
  "${CLAUDE_PLUGIN_ROOT:-}" \
  "${CODEX_PLUGIN_ROOT:-}" \
  "${PLUGIN_ROOT:-}" \
  "$HOME/.agentlas/runtime/current/host_adapters/claude/plugins/agentlas-core-engine-meta-agent" \
  "$HOME/.agentlas/runtime/current/host_adapters/codex/plugins/agentlas-core-engine-meta-agent" \
  "$HOME/.agentlas/runtime/current" \
  "."
do
  if [ -n "$candidate" ] && [ -f "$candidate/AGENTS.md" ] && [ -f "$candidate/package-contract.json" ] && [ -f "$candidate/contracts/builder-interview-research-gate.md" ]; then
    ENGINE="$candidate"; break
  fi
done
[ -n "$ENGINE" ] || { echo "Hephaestus engine not found. Run the installer first." >&2; exit 1; }
RUNNER="$HOME/.agentlas/runtime/current/bin/hephaestus"
[ -x "$RUNNER" ] || RUNNER="$ENGINE/bin/hephaestus"
[ -x "$RUNNER" ] || { echo "Hephaestus runner not found under $ENGINE." >&2; exit 1; }
```

Read `$ENGINE/AGENTS.md`, `$ENGINE/.agentlas/mode-map.json`, the selected mode
contract, and `$ENGINE/contracts/builder-interview-research-gate.md`. Take
exactly one user-named or confirmed folder as `PACKAGE_TARGET`; if none or
multiple candidates exist, stop and ask. Never default to `.`, cwd, or
`$ENGINE`. Run `"$RUNNER" contract resolve-target "$PACKAGE_TARGET" --base
"$PWD"` and set `PACKAGE_ROOT` only to the status-`ok` receipt's exact
`package_root` before any package command.

For creation or behavior-changing packaging work, classify the request as
single-agent-builder, multi-agent-team-builder, or agentlas-packager by
independent ownership boundaries. If single↔multi is unclear, ask first in
plain language: "이 일을 한 명의 전문가가 처음부터 끝까지 맡으면 되나요, 아니면
조사/분석/검토처럼 여러 전문가가 나눠 맡고 마지막에 합쳐야 하나요?" Do not show
non-technical users internal labels like ownership boundary, memory/context,
synthesis, or produces/consumes. Then run
the Builder Interview and Research Gate from
`$ENGINE/contracts/builder-interview-research-gate.md` before writing substantial package
files. Ask an 8-12 question first batch when the request is vague, continue
follow-ups until the functional brief, role count, ownership boundaries, tool
permission separation, synthesis need, and execution order are clear, research
official sources, similar agent repositories or comparables,
academic/professional theory, and plugin docs, compare selected and rejected
tools/plugins, synthesize domain-expert behavior, and create
`docs/builder-interview.md`,
`docs/research-sources.md`, `docs/tool-selection.md`,
`docs/domain-expert-synthesis.md`, `docs/prompt-performance-contract.md`, and
`.agentlas/capability-eval-plan.json`.

Write all generated or repaired runtime agent instructions in English:
`AGENTS.md`, `CLAUDE.md`, `GEMINI.md`, `agent.md`, skills, workflow/command
adapters, runtime prompts, handoff contracts, return contracts, and operating
docs. Translate Korean or other-language source material into English agent
behavior. Localized marketplace copy, routing trigger examples, and sample user
inputs may use the target user language.

Generate or repair the Agentlas package, run
Before writing any package file, lay the contract down:
`"$RUNNER" contract scaffold "$PACKAGE_ROOT" --mode single|team|package`.
Then run `"$RUNNER" contract complete "$PACKAGE_ROOT" --mode single|team|package` — the engine
fills every artifact the package already answers (agent.md, work brief, sitemap,
routing benchmarks, capability eval plan, builder interview, research sources,
output example) from the routing card, the roster, and the schemas on disk. It
never overwrites an authored body and never invents a fact. Run it BEFORE
`contract verify`.
It copies every required artifact into place with named `{{PLACEHOLDER}}` holes and
never overwrites. Skipping it is how a build ends with 5 of 18 required artifacts
and still reports success. `contract prompt --mode <mode>` lists what each one is for.

`"$RUNNER" contract verify "$PACKAGE_ROOT" --mode single|team|package` (this runs the team-shape rule too), verify it, and include the
`global_commands` section from `.agentlas/global-commands.json` and
`interview_research` evidence in the final response.
If the shape gate fails, do not report `completed`; correct the package by
collapsing to a valid single-agent shape or adding orchestrator/HQ plus
company-blueprint topology, then rerun the gate.

If the first argument is `ontology`, open the project ontology GUI by running
`"$RUNNER" ontology --gui .`,
then report `gui_url`, `db_path`, `inbox_path`, and verification status.

If a package was created or repaired in the current workspace, register it to local
discovery before final reporting:

`"$RUNNER" cards migrate "$PACKAGE_ROOT" --tier local --overwrite`

Include the migration result in `interview_research`.

After the package is verified and saved locally, ask exactly one final
two-choice question, using structured choices when available:

1. **Cloud에 올리기** — save owner-private in Agent Cloud so the same account
   can restore it on other Desktops. Mobile can use it only after a paired
   Desktop restores/installs it; Agent Cloud is not a hosted LLM executor.
2. **로컬에만 저장** — keep the completed package on this computer and perform
   no network mutation.

Never upload by default. Missing input or a non-interactive host means
local-only. Only after explicit Cloud consent, resolve the trusted Hephaestus
runner and run `"$RUNNER" upload "$PACKAGE_ROOT" --visibility private-link`
against the exact verified package root. Authentication, offline, CAS, quota,
or security failure must leave the local package intact and be reported with
an exact retry command. Public Hub publication is a separate explicit action.
"""
