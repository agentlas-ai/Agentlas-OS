<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Download Agentlas Desktop</title>
  <desc id="desc">Download Agentlas Desktop for macOS, Windows, or Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060811"/>
      <stop offset="0.52" stop-color="#0C1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="prism" x1="48" y1="52" x2="1152" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="0.42" stop-color="#93C5FD"/>
      <stop offset="0.72" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#D9F99D"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientTransform="translate(170 182) rotate(-8) scale(340 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientTransform="translate(1040 100) rotate(172) scale(300 190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%">
