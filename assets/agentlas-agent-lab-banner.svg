  <ellipse cx="170" cy="182" rx="340" ry="210" fill="url(#mintGlow)" filter="url(#blur)"/>
  <ellipse cx="1040" cy="100" rx="300" ry="190" fill="url(#pinkGlow)" filter="url(#blur)"/>

  <rect x="42" y="46" width="1116" height="228" rx="34" fill="#F8FAFC" fill-opacity="0.055" stroke="url(#prism)" stroke-width="2"/>
  <rect x="58" y="62" width="1084" height="196" rx="26" fill="#020617" fill-opacity="0.36" stroke="#F8FAFC" stroke-opacity="0.1"/>
  <path d="M94 106H1106" stroke="url(#prism)" stroke-opacity="0.58" stroke-width="2"/>
  <path d="M94 214H1106" stroke="url(#prism)" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="88" cy="160" r="5" fill="#6EE7B7"/>
  <circle cx="1112" cy="160" r="5" fill="#F472B6"/>

  <text x="600" y="188" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.4">Download Agentlas Desktop <tspan fill="#A7F3D0">&#8594;</tspan></text>
